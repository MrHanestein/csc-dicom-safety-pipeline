name: CSC-DCB0129-Safety-Gate-CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  verify-safety-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: pip install pydicom pytest numpy

      - name: Run Deterministic Stage 5 Safety Gate & Hazard Suite
        run: PYTHONPATH=. pytest -v
